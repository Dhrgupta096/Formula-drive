    function initCustomFeatures() {
      console.log("F1 Simulator Features Initialized successfully!");
      
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      const tooltip = document.getElementById('dhruvPartTooltip');
      const camSelector = document.getElementById('dhruvCameraSelector');
      
      // Multilingual toggle function
      function setLanguage(lang) {
        currentLang = lang;
        const t = translations[lang];
        
        document.title = t.title;
        document.querySelector('#loader-content-progress-copy').textContent = t.loading;
        document.querySelector('#loader-content-title p').textContent = "FORMULA 1 PLAYGROUND";
        document.querySelector('.demoMenu-content-copy.letterSpacing').textContent = t.subtitle;
        document.querySelectorAll('.demoMenu-content-copy.letterSpacing')[1].textContent = t.controls;
        
        // Mode picker buttons text updates while keeping brackets intact
        const modeBtns = document.querySelectorAll('.demoFormulaModePicker-btn');
        modeBtns.forEach(btn => {
          const mode = btn.dataset.mode;
          let label = "";
          if (mode === 'kit') label = t.kit;
          else if (mode === 'assembled') label = t.drive;
          else if (mode === 'studio') label = t.studio;
          btn.innerHTML = `<span class="demoFormulaModePicker-bracket">[</span>${label}<span class="demoFormulaModePicker-bracket">]</span>`;
        });
        
        // Camera button updates
        document.querySelector('.dhruv-cam-btn[data-cam="chase"]').textContent = t.chase;
        document.querySelector('.dhruv-cam-btn[data-cam="helmet"]').textContent = t.helmet;
        document.querySelector('.dhruv-cam-btn[data-cam="tv"]').textContent = t.tv;
      }

      // Bind Language Switcher Buttons
      const langBtns = document.querySelectorAll('.dhruv-lang-btn');
      langBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          langBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          setLanguage(btn.dataset.lang);
        });
      });

      // Hover inspect Raycaster with full node hierarchy walkup
      window.addEventListener('pointermove', (e) => {
        const isKitMode = document.querySelector('.demoFormulaModePicker-btn[data-mode="kit"]').getAttribute('aria-pressed') === 'true';
        if (!isKitMode || !window.app || !window.webgl || !window.webgl.scene || !window.webgl.camera) {
          tooltip.classList.remove('visible');
          return;
        }
        
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        
        raycaster.setFromCamera(mouse, window.webgl.camera);
        const intersects = raycaster.intersectObjects(window.webgl.scene.children, true);
        
        if (intersects.length > 0) {
          let hitObj = intersects[0].object;
          let found = null;
          let current = hitObj;
          
          // Walk up hierarchy to find a node match
          while (current && current !== window.webgl.scene) {
            let nameLower = (current.name || "").toLowerCase();
            for (const [key, info] of Object.entries(brands)) {
              if (nameLower.includes(key)) {
                found = info;
                break;
              }
            }
            if (found) break;
            current = current.parent;
          }
          
          if (found) {
            tooltip.querySelector('.dhruv-tooltip-title').textContent = found.name[currentLang].toUpperCase();
            tooltip.querySelector('.dhruv-tooltip-brand').textContent = found.brand.toUpperCase();
            tooltip.querySelector('.dhruv-tooltip-desc').textContent = found.desc[currentLang];
            tooltip.classList.add('visible');
            
            tooltip.style.left = `${e.clientX}px`;
            tooltip.style.top = `${e.clientY}px`;
            return;
          }
        }
        tooltip.classList.remove('visible');
      });

      // Camera selector buttons event binding
      const camBtns = document.querySelectorAll('.dhruv-cam-btn');
      camBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          camBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeCamMode = btn.dataset.cam;
        });
      });

      // Monkey-patch window.app.update to override camera position after physics runs
      const originalUpdate = window.app.update;
      window.app.update = function(e) {
        // 1. Call original update first
        originalUpdate.call(this, e);
        
        // 2. Custom Camera Override logic
        const isDriveMode = document.querySelector('.demoFormulaModePicker-btn[data-mode="assembled"]').getAttribute('aria-pressed') === 'true';
        if (isDriveMode) {
          camSelector.classList.add('visible');
        } else {
          camSelector.classList.remove('visible');
          if (activeCamMode !== 'chase') {
             activeCamMode = 'chase';
             camBtns.forEach(b => b.classList.remove('active'));
             document.querySelector('.dhruv-cam-btn[data-cam="chase"]').classList.add('active');
          }
          return;
        }

        // Get the car group from the global window.car hook
        const car = window.car && window.car.mesh;
        if (!car || !window.webgl.camera) return;

        if (activeCamMode === 'helmet') {
          // Camera relative offsets for Helmet view (driver's eye level)
          const relativeOffset = new THREE.Vector3(0, 0.72, -0.15);
          const targetOffset = new THREE.Vector3(0, 0.65, 3.0);
          
          const camPos = relativeOffset.clone().applyMatrix4(car.matrixWorld);
          const lookTarget = targetOffset.clone().applyMatrix4(car.matrixWorld);
          
          window.webgl.camera.position.copy(camPos);
          window.webgl.camera.lookAt(lookTarget);
        } else if (activeCamMode === 'tv') {
          // Fixed TV broadcast cam at table corner
          const tvCamPos = new THREE.Vector3(3.5, 1.8, 3.5);
          window.webgl.camera.position.copy(tvCamPos);
          window.webgl.camera.lookAt(car.position);
        }
      };
    }

    // Poller to detect when window.app and all WebGL handles are ready
    function checkApp() {
      if (window.app && window.webgl && window.webgl.scene && window.webgl.camera && window.car && window.car.mesh) {
        initCustomFeatures();
      } else {
        setTimeout(checkApp, 100);
      }
    }
    checkApp();
  </script>
