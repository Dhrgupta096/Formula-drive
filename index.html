    // Helper to safely update DOM text without risk of Null Pointer Exceptions
    function safeSetText(selector, text, index = 0) {
      const els = document.querySelectorAll(selector);
      if (els && els[index]) {
        els[index].textContent = text;
      }
    }

    // Helper to apply colors safely to materials or material arrays
    function applyColorToMat(mat, hex) {
      if (!mat) return;
      if (Array.isArray(mat)) {
        mat.forEach(m => applyColorToMat(m, hex));
        return;
      }
      if (mat.color && typeof mat.color.setStyle === 'function') {
        mat.color.setStyle(hex);
      }
    }

    function initCustomFeatures() {
      console.log("F1 Simulator Features Initialized successfully!");
      
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      const tooltip = document.getElementById('dhruvPartTooltip');
      const camSelector = document.getElementById('dhruvCameraSelector');
      const colorPicker = document.getElementById('dhruvColorPicker');
      const speedoHUD = document.getElementById('dhruvSpeedoHUD');
      const audioBtn = document.getElementById('dhruvAudioToggle');
      
      // Multilingual toggle function
      function setLanguage(lang) {
        currentLang = lang || 'en';
        const t = translations[currentLang] || translations.en;
        
        document.title = t.title;
        safeSetText('#loader-content-progress-copy', t.loading);
        safeSetText('#loader-content-title p', "FORMULA 1 PLAYGROUND");
        safeSetText('.demoMenu-content-copy.letterSpacing', t.subtitle, 0);
        safeSetText('.demoMenu-content-copy.letterSpacing', t.controls, 1);
        
        // Mode picker buttons text updates while keeping brackets intact
        const modeBtns = document.querySelectorAll('.demoFormulaModePicker-btn');
        modeBtns.forEach(btn => {
          const mode = btn.dataset.mode;
          let label = "";
          if (mode === 'kit') label = t.kit;
          else if (mode === 'assembled') label = t.drive;
          else if (mode === 'studio') label = t.studio;
          btn.innerHTML = `<span class="demoFormulaModePicker-bracket">[</span>${label}<span class="demoFormulaModePicker-bracket">]</span>`;
        });
        
        // Camera button updates
        safeSetText('.dhruv-cam-btn[data-cam="chase"]', t.chase);
        safeSetText('.dhruv-cam-btn[data-cam="helmet"]', t.helmet);
        safeSetText('.dhruv-cam-btn[data-cam="tv"]', t.tv);

        // Audio button text update
        audioBtn.textContent = isAudioActive ? t.soundOn : t.soundOff;
      }

      // Bind Language Switcher Buttons
      const langBtns = document.querySelectorAll('.dhruv-lang-btn');
      langBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          langBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          setLanguage(btn.dataset.lang);
        });
      });

      // Synchronous Web Audio context initialization on direct user gesture click
      audioBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        isAudioActive = !isAudioActive;
        audioBtn.classList.toggle('active', isAudioActive);
        audioBtn.textContent = isAudioActive ? translations[currentLang].soundOn : translations[currentLang].soundOff;
        
        if (isAudioActive) {
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gainNode.connect(audioCtx.destination);
            
            engineOsc = audioCtx.createOscillator();
            engineOsc.type = 'sawtooth';
            engineOsc.frequency.setValueAtTime(70, audioCtx.currentTime);
            
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(850, audioCtx.currentTime);
            
            engineOsc.connect(filter);
            filter.connect(gainNode);
            engineOsc.start();

            turboOsc = audioCtx.createOscillator();
            turboOsc.type = 'sine';
            turboOsc.frequency.setValueAtTime(1100, audioCtx.currentTime);
            
            const turboGain = audioCtx.createGain();
            turboGain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            
            turboOsc.connect(turboGain);
            turboGain.connect(gainNode);
            turboOsc.start();
          } else if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
          if (gainNode) gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
        } else {
          if (gainNode) gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
        }
      });

      // Bind Car Paint Color Picker with deep material traversal
      const colorDots = document.querySelectorAll('.dhruv-color-dot');
      colorDots.forEach(dot => {
        dot.addEventListener('click', (e) => {
          e.stopPropagation();
          colorDots.forEach(d => d.classList.remove('active'));
          dot.classList.add('active');
          const hexColor = dot.dataset.color;
          
          // 1. Update window.carMaterials if available
          if (window.carMaterials) {
            Object.values(window.carMaterials).forEach(mat => {
              const nameLower = (mat.name || "").toLowerCase();
              if (nameLower.includes('body') || nameLower.includes('paint') || nameLower.includes('chassis') || nameLower.includes('main')) {
                applyColorToMat(mat, hexColor);
              }
            });
          }
          
          # 2. Traverse car mesh hierarchy
          const car = window.car && window.car.mesh;
          if (car) {
            car.traverse(child => {
              if (child.isMesh && child.material) {
                const nameLower = (child.name || "").toLowerCase();
                const matNameLower = (Array.isArray(child.material) ? child.material.map(m=>m.name||'').join(' ') : child.material.name || "").toLowerCase();
                if (nameLower.includes('body') || nameLower.includes('chassis') || matNameLower.includes('body') || matNameLower.includes('paint')) {
                  applyColorToMat(child.material, hexColor);
                }
              }
            });
          }
        });
      });

      // Hover inspect Raycaster with full node hierarchy walkup
      window.addEventListener('pointermove', (e) => {
        const isKitMode = document.querySelector('.demoFormulaModePicker-btn[data-mode="kit"]').getAttribute('aria-pressed') === 'true';
        if (!isKitMode || !window.app || !window.webgl || !window.webgl.scene || !window.webgl.camera) {
          tooltip.classList.remove('visible');
          return;
        }
        
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        
        raycaster.setFromCamera(mouse, window.webgl.camera);
        const intersects = raycaster.intersectObjects(window.webgl.scene.children, true);
        
        if (intersects.length > 0) {
          let hitObj = intersects[0].object;
          let found = null;
          let current = hitObj;
          
          // Walk up hierarchy to find a node match
          while (current && current !== window.webgl.scene) {
            let nameLower = (current.name || "").toLowerCase();
            for (const [key, info] of Object.entries(brands)) {
              if (nameLower.includes(key)) {
                found = info;
                break;
              }
            }
            if (found) break;
            current = current.parent;
          }
          
          if (found && found.name[currentLang]) {
            tooltip.querySelector('.dhruv-tooltip-title').textContent = found.name[currentLang].toUpperCase();
            tooltip.querySelector('.dhruv-tooltip-brand').textContent = found.brand.toUpperCase();
            tooltip.querySelector('.dhruv-tooltip-desc').textContent = found.desc[currentLang];
            tooltip.classList.add('visible');
            
            tooltip.style.left = `${e.clientX}px`;
            tooltip.style.top = `${e.clientY}px`;
            return;
          }
        }
        tooltip.classList.remove('visible');
      });

      // Camera selector buttons event binding
      const camBtns = document.querySelectorAll('.dhruv-cam-btn');
      camBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          camBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeCamMode = btn.dataset.cam;
        });
      });

      // Monkey-patch window.app.update to override camera position after physics runs
      const originalUpdate = window.app.update;
      window.app.update = function(e) {
        originalUpdate.call(this, e);
        
        const isDriveMode = document.querySelector('.demoFormulaModePicker-btn[data-mode="assembled"]').getAttribute('aria-pressed') === 'true';
        const isStudioMode = document.querySelector('.demoFormulaModePicker-btn[data-mode="studio"]').getAttribute('aria-pressed') === 'true';
        const isKitMode = document.querySelector('.demoFormulaModePicker-btn[data-mode="kit"]').getAttribute('aria-pressed') === 'true';

        // Toggle Color Picker visibility (Studio and Kit modes)
        if (isStudioMode || isKitMode) {
          colorPicker.classList.remove('hidden');
        } else {
          colorPicker.classList.add('hidden');
        }

        // Toggle Camera Selector and Speedometer HUD visibility (Drive mode)
        if (isDriveMode) {
          camSelector.classList.add('visible');
          speedoHUD.classList.add('visible');
        } else {
          camSelector.classList.remove('visible');
          speedoHUD.classList.remove('visible');
          if (gainNode && isAudioActive && audioCtx) {
            gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
          }
          // Reset target mode to chase if not in drive mode
          if (activeCamMode !== 'chase') {
             activeCamMode = 'chase';
             camBtns.forEach(b => b.classList.remove('active'));
             document.querySelector('.dhruv-cam-btn[data-cam="chase"]').classList.add('active');
          }
          return;
        }

        // Get the car group from the global window.car hook
        const car = window.car && window.car.mesh;
        if (!car || !window.webgl.camera) return;

        // Speedometer Calculation (KM/H)
        const dist = car.position.distanceTo(prevCarPos);
        prevCarPos.copy(car.position);
        
        // Velocity (units per delta frame) -> KM/H conversion
        const kmh = Math.round(dist * 60 * 3.6 * 8.0);
        document.getElementById('dhruvSpeedoVal').textContent = kmh;
        
        // Gear & RPM Indicator
        let gear = "N";
        let rpmPct = Math.min(100, Math.max(10, (kmh % 40) / 40 * 100));
        if (kmh > 0 && kmh < 25) gear = "G1";
        else if (kmh >= 25 && kmh < 60) gear = "G2";
        else if (kmh >= 60 && kmh < 100) gear = "G3";
        else if (kmh >= 100 && kmh < 140) gear = "G4";
        else if (kmh >= 140 && kmh < 180) gear = "G5";
        else if (kmh >= 180 && kmh < 220) gear = "G6";
        else if (kmh >= 220 && kmh < 270) gear = "G7";
        else if (kmh >= 270) gear = "G8";
        
        document.getElementById('dhruvSpeedoGear').textContent = `GEAR: ${gear}`;
        document.getElementById('dhruvRpmFill').style.width = `${rpmPct}%`;

        // Update Web Audio Sound
        if (isAudioActive && audioCtx && engineOsc) {
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const targetEngineFreq = 70 + (kmh * 2.2);
          const targetTurboFreq = 1100 + (kmh * 6.0);
          const targetGain = 0.12 + Math.min(0.25, kmh / 500);
          
          engineOsc.frequency.setTargetAtTime(targetEngineFreq, audioCtx.currentTime, 0.08);
          turboOsc.frequency.setTargetAtTime(targetTurboFreq, audioCtx.currentTime, 0.08);
          gainNode.gain.setTargetAtTime(targetGain, audioCtx.currentTime, 0.08);
        }

        // Force car matrixWorld update before computing transformed offsets
        car.updateMatrixWorld(true);

        // Camera Overrides
        if (activeCamMode === 'helmet') {
          // Camera relative offsets for Helmet view (driver's eye level)
          const relativeOffset = new THREE.Vector3(0, 0.72, -0.15);
          const targetOffset = new THREE.Vector3(0, 0.65, 3.0);
          
          const camPos = relativeOffset.clone().applyMatrix4(car.matrixWorld);
          const lookTarget = targetOffset.clone().applyMatrix4(car.matrixWorld);
          
          window.webgl.camera.position.copy(camPos);
          window.webgl.camera.lookAt(lookTarget);
        } else if (activeCamMode === 'tv') {
          // Fixed TV broadcast cam at table corner
          const tvCamPos = new THREE.Vector3(3.5, 1.8, 3.5);
          window.webgl.camera.position.copy(tvCamPos);
          window.webgl.camera.lookAt(car.position);
        }
      };
    }

    // Poller to detect when window.app and all WebGL handles are ready
    function checkApp() {
      if (window.app && window.webgl && window.webgl.scene && window.webgl.camera && window.car && window.car.mesh) {
        initCustomFeatures();
      } else {
        setTimeout(checkApp, 100);
      }
    }
    checkApp();
  </script>
